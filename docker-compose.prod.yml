version: '3.8'

services:
  # 1. Django 백엔드 (수정됨)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn news_node.wsgi:application --bind 0.0.0.0:8000
    expose:
      - 8000  # [중요] 외부 ports 대신 내부 expose만 사용
    # ports:  <-- [중요] 이 부분은 반드시 삭제하거나 주석 처리 (#)
    #   - "8000:8000"
    env_file:
      - .env.prod
    depends_on:
      - db
    networks:
      - news-network

  # 2. 데이터베이스 (기존 유지)
  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.prod
    networks:
      - news-network

  # 3. Nginx Proxy Manager (새로 추가)
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      - '80:80'      # HTTP 접속용
      - '81:81'      # 관리자 페이지용
      - '443:443'    # HTTPS 접속용
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    depends_on:
      - web
    networks:
      - news-network

volumes:
  postgres_data:

networks:
  news-network:
    driver: bridge