version: '3.8'

services:
  # 1. Django 웹 서버
  web:
    build: .
    # [체크] manage.py가 backend 폴더 안에 있으므로 --chdir backend 필수
    command: gunicorn --bind 0.0.0.0:8000 --chdir backend config.wsgi:application
    volumes:
      - .:/app
      - static_volume:/app/backend/static  # [주의] settings.py의 STATIC_ROOT 경로와 일치해야 함
      - media_volume:/app/backend/media
    expose:
      - 8000
    env_file:
      - .env
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
    depends_on:
      - db
      - redis

  # 2. Nginx (리버스 프록시)
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      # [수정] nginx 폴더가 backend 안에 있다면 아래 경로가 맞음. 
      # 만약 루트에 nginx 폴더가 있다면 ./nginx/nginx.conf로 변경하세요.
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static # Nginx는 내부적으로 이 경로를 참조 (nginx.conf alias와 일치)
      - media_volume:/app/media
    depends_on:
      - web

  # 3. 데이터베이스
  db:
    image: ankane/pgvector:latest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    # [수정] 보안을 위해 외부 포트 노출(ports) 제거. 
    # 같은 도커 네트워크의 web 컨테이너는 호스트명 'db'로 접근 가능함.
    expose:
      - 5432

  # 4. Redis
  redis:
    image: redis:alpine
    expose:
      - 6379

volumes:
  postgres_data:
  static_volume:
  media_volume: