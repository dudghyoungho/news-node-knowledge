<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>My Knowledge Universe</title>
    <script src="//unpkg.com/force-graph"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000011; color: white; font-family: 'Apple SD Gothic Neo', sans-serif; }
        #graph-container { width: 100vw; height: 100vh; }
        
        /* 컨트롤 패널 스타일 */
        .controls { position: absolute; top: 20px; left: 20px; z-index: 99; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); }
        h1 { margin: 0 0 10px 0; font-size: 16px; color: #74b9ff; font-weight: bold; }
        p { margin: 5px 0 0; font-size: 12px; color: #ddd; }
        
        /* 데이터 없음 메시지 */
        #empty-message {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: #888; display: none;
        }
    </style>
</head>
<body>

    <div class="controls">
        <h1>🌌 Knowledge Galaxy</h1>
        <p>🖱️ 휠: 확대/축소</p>
        <p>🖐️ 드래그: 이동</p>
        <p>👆 클릭: 원문 이동</p>
    </div>

    <div id="empty-message">
        <h2>데이터가 없습니다 텅...🪐</h2>
        <p>뉴스를 요약하고 저장하면 이곳에 별이 뜹니다.</p>
    </div>

    <div id="graph-container"></div>

    <script>
        const elem = document.getElementById('graph-container');
        const emptyMsg = document.getElementById('empty-message');

        // 1. 그래프 설정
        const Graph = ForceGraph()(elem)
            .backgroundColor('#000011')
            .nodeId('id')             // 고유 식별자 (views.py의 article_id)
            .nodeLabel('name')        // 마우스 올렸을 때 뜨는 이름 (views.py의 article.title)
            .nodeVal('val')           // 노드 크기
            
            // 노드 색상: 그룹1(기사)=파랑, 그룹2(카테고리)=주황
            .nodeColor(node => node.group === 2 ? '#ff7675' : '#0984e3')
            
            // 링크 디자인
            .linkColor(() => 'rgba(255,255,255,0.2)')
            .linkWidth(1)

            // 노드 클릭 이벤트
            .onNodeClick(node => {
                if (node.url) {
                    window.open(node.url, '_blank');
                } else {
                    // 카테고리 노드 클릭 시 (확대해서 보여주기)
                    Graph.centerAt(node.x, node.y, 1000);
                    Graph.zoom(8, 2000);
                }
            });

        // 2. 데이터 불러오기
        fetch('/api/news/api/graph/')
            .then(res => {
                if (res.status === 401) {
                    // 로그인 풀렸을 때 처리
                    document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:20%'>로그인이 필요합니다.</h2>";
                    throw new Error("Unauthorized");
                }
                return res.json();
            })
            .then(data => {
                console.log("Graph Data:", data); // 디버깅용 로그

                // 데이터가 비어있는 경우
                if (data.nodes.length === 0) {
                    emptyMsg.style.display = 'block';
                } else {
                    emptyMsg.style.display = 'none';
                    Graph.graphData(data);
                    
                    // 약간의 딜레이 후 줌인 효과
                    setTimeout(() => Graph.zoomToFit(400, 50), 500);
                }
            })
            .catch(err => console.error("Error loading graph:", err));
    </script>
</body>
</html>
