{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Knowledge Universe</title>
    <script src="//unpkg.com/d3"></script>
    <script src="//unpkg.com/force-graph"></script>
    <link rel="stylesheet" href="{% static 'news/css/graph.css' %}">
</head>
<body>

    <div class="controls">
        <h1>🌌 Knowledge Galaxy</h1>
        <p>Click a blue star to view the summary.</p>
        <p>Drag empty space to navigate.</p>
    </div>

    <div id="empty-message">
        <h2>It's empty here... 🪐</h2>
        <p>Stars will appear here when you save news summaries.</p>
    </div>

    <div id="summary-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div id="modal-title" class="modal-title">Article Title</div>
                <button class="close-btn">×</button>
            </div>
            
            <img id="modal-img" class="modal-img" src="" alt="Article Thumbnail">

            <div id="modal-summary" class="modal-body">
                The 3-line summary will appear here...
            </div>
            <div class="modal-footer">
                <button id="btn-go-article" class="btn-link">Read Original Article 🚀</button>
            </div>
        </div>
    </div>

    <div id="graph-container"></div>

    <script src="{% static 'news/js/graph.js' %}"></script>
</body>
</html>
