{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>내 지식 대시보드</title>
    <link rel="stylesheet" href="{% static 'news/css/dashboard.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="sidebar">
        <div class="logo">News-Node-Knowledge 🧠</div>
        <div class="menu-item active">My knowledge</div>
        <div class="menu-item">My Librarian</div>
    </div>

    <div class="main-content">
        <div class="header">나의 지식 연결망</div>
        
        <div class="chart-container">
            <h3 style="margin: 0 0 15px 0; font-size: 16px; color: #555;">📅 일별 지식 축적량</h3>
            <div style="height: 200px;">
                <canvas id="activityChart"></canvas>
            </div>
        </div>

        <div class="graph-container">
            <iframe src="/api/news/graph/"></iframe>
        </div>
    </div>

    <script src="{% static 'news/js/dashboard.js' %}"></script>
</body>
</html>
