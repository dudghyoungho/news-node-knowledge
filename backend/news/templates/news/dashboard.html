<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>내 지식 대시보드</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', sans-serif; display: flex; height: 100vh; background-color: #f4f6f8; }
        
        /* 1. 왼쪽 사이드바 */
        .sidebar { width: 250px; background-color: #2c3e50; color: white; display: flex; flex-direction: column; padding: 20px; }
        .logo { font-size: 20px; font-weight: bold; margin-bottom: 40px; color: #00d2d3; }
        .menu-item { padding: 15px; cursor: pointer; border-radius: 8px; margin-bottom: 10px; transition: 0.3s; }
        .menu-item:hover { background-color: #34495e; }
        .menu-item.active { background-color: #0984e3; font-weight: bold; }
        
        /* 2. 메인 컨텐츠 영역 */
        .main-content { flex: 1; padding: 30px; display: flex; flex-direction: column; overflow: hidden; }
        .header { font-size: 24px; font-weight: bold; margin-bottom: 20px; color: #333; }
        
        /* 3. 그래프가 들어갈 카드 박스 */
        .graph-container {
            flex: 1; /* 남은 높이 다 차지하기 */
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        /* ★ 핵심: Iframe 스타일 (그래프 끼워넣기) */
        iframe {
            width: 100%;
            height: 100%;
            border: none; /* 테두리 없애기 */
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">News-Node-Knowledge 🧠</div>
        <div class="menu-item active">My knowledge</div>
        <div class="menu-item">My Librarian</div>
        <div class="menu-item"></div>
    </div>

    <div class="main-content">
        <div class="header">나의 지식 연결망</div>
        
        <div class="graph-container">
            <iframe src="/api/news/graph/"></iframe>
        </div>
    </div>

</body>
</html>
