{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Knowledge Dashboard</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        "paper-base": "#F4F1EA",
                        "paper-ink": "#1A1A1A",
                        "accent-red": "#A52A2A"
                    },
                    fontFamily: {
                        "display": ["Work Sans", "sans-serif"],
                        "serif-title": ["Playfair Display", "serif"]
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="{% static 'news/css/dashboard.css' %}">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'news/favicon.ico' %}">

    <style>
        /* [디자인] 신문지 질감 (노이즈 필터) */
        .paper-texture {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04; pointer-events: none;
        }
        
        /* [호환성] 탭 전환 로직용 클래스 */
        .view-section { display: none; }
        .view-section.active { display: block; }

        /* [호환성] 다크테마 격리 (Librarian 탭은 무조건 밝게) */
        #view-librarian {
            background-color: #e9e5de !important; 
            color: #1a1a1a !important;
            position: absolute; top: 0; left: 0; width: 100%; min-height: 100%;
            z-index: 50; padding: 0 !important;
        }
        /* 내부 링크 및 텍스트 강제 설정 */
        #view-librarian a { color: inherit; text-decoration: none; }
        #view-librarian h1, #view-librarian h2, #view-librarian h3, #view-librarian p { color: #1a1a1a; }

        /* [JS 데이터 호환] JS가 생성하는 뱃지 스타일 재정의 */
        #view-librarian .bridge-keywords span, 
        #view-librarian .badge, 
        #view-librarian .keyword-tag {
            display: inline-block; padding: 2px 8px; border-radius: 4px; 
            font-size: 10px; font-weight: bold; margin-right: 4px;
            background: #eee; color: #333; border: 1px solid #ccc;
        }
    </style>
</head>
<body class="dark-theme">

    {% include 'news/components/mobile_menu.html' %}
    {% include 'news/components/sidebar.html' %}

    <div class="main-content">
        <div class="graph-background">
            <iframe src="/api/news/graph/" id="graph-frame" allowtransparency="true"></iframe>
        </div>

        <div id="view-knowledge" class="view-section active">
            {% include 'news/views/knowledge.html' %}
        </div>

        {% include 'news/views/librarian.html' %}
    </div> 

    <div id="article-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button class="close-btn" onclick="DashboardUI.closeModal()">×</button>
            <div class="modal-header-section">
                <img id="modal-thumb" src="" alt="" style="display:none; width:100%; height:200px; object-fit:cover; border-radius:8px; margin-bottom:15px;">
                <div class="meta-row">
                    <span id="modal-date" class="modal-date"></span>
                    <span id="modal-category" class="modal-badge"></span>
                </div>
                <h2 id="modal-title">Loading...</h2>
            </div>

            <div id="bridge-section" class="bridge-container" style="display: none;">
                <div id="bridge-slot-a" class="bridge-card origin-card" style="display:none;">
                    <div class="bridge-label">⚡ 발단 (Origin)</div>
                    <div class="bridge-content">
                        <div class="bridge-keywords" id="slot-a-keywords"></div>
                        <div class="bridge-title" id="slot-a-title"></div>
                        <div class="bridge-comment" id="slot-a-comment"></div>
                    </div>
                </div>
                <div class="bridge-anchor">
                    <div class="anchor-line"></div>
                    <div class="anchor-dot"></div>
                    <span>Current Reading</span>
                    <div class="anchor-line"></div>
                </div>
                <div id="bridge-slot-b" class="bridge-card verdict-card" style="display:none;">
                    <div class="bridge-label">⚖️ 검증 (Verdict)</div>
                    <div class="bridge-content">
                        <div class="bridge-keywords" id="slot-b-keywords"></div>
                        <div class="bridge-title" id="slot-b-title"></div>
                        <div class="bridge-comment" id="slot-b-comment"></div>
                    </div>
                </div>
            </div>

            <div class="modal-body">
                <p id="modal-summary" class="summary-text"></p>
            </div>
            <div class="modal-footer">
                <button id="btn-open-original" class="btn-primary">원문 전체 읽기 (Original Link)</button>
            </div>
        </div>
    </div>

    <script src="{% static 'news/js/modules/dashboard_ui.js' %}"></script>
    <script src="{% static 'news/js/modules/dashboard_data.js' %}"></script>
    <script src="{% static 'news/js/dashboard.js' %}"></script>
</body>
</html>
