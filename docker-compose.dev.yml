services:
  web:
    build: .
    depends_on:
      - db
    command: python backend/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # [핵심 1] DB 주소를 명확히 지정합니다.
      - DB_HOST=db
      # [핵심 2] 포트나 이름 등도 확실하게 (settings.py와 맞춤)
      - DB_PORT=5432
      - ALLOWED_HOSTS=localhost 127.0.0.1 news.young-dev.link .young-dev.link 43.203.231.70


  db:
    image: ankane/pgvector:latest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"

volumes:
  postgres_data: