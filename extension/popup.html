<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 350px; font-family: 'Apple SD Gothic Neo', sans-serif; padding: 15px; }
        h2 { margin: 0 0 10px 0; font-size: 18px; color: #333; }
        
        /* 요약 내용이 뜨는 박스 */
        #summary-box {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            min-height: 100px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
            white-space: pre-wrap; /* 줄바꿈 적용 */
        }

        /* 버튼 스타일 */
        button {
            width: 100%;
            padding: 10px;
            background-color: #03C75A; /* 네이버 그린 */
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 5px;
            transition: background-color 0.3s;
        }
        button:hover { background-color: #02b150; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        /* 상태 메시지 */
        #status { font-size: 12px; color: #666; margin-top: 5px; text-align: center; }
        
        /* 유틸리티 클래스 */
        .hidden { display: none; }
    </style>
</head>
<body>
    <h2>📰 AI 기사 요약</h2>
    
    <div id="summary-box">버튼을 누르면 요약을 시작합니다.</div>

    <button id="btn-summarize">⚡️ 3줄 요약 시작</button>
    <button id="btn-save" class="hidden">💾 내 서재에 저장</button>

    <div id="status"></div>

    <script src="popup.js"></script>
</body>
</html>
